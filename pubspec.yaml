name: amar
description: TekVend electronics marketplace with an interactive web demo and the original Firebase application.
publish_to: none
version: 2.0.0+2
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_database: ^11.0.1
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.0.1
  image_picker: ^1.1.2
  firebase_storage: ^12.0.1
  url_launcher: ^6.3.0
  font_awesome_flutter: ^11.0.0
  shared_preferences: ^2.2.3
  get: ^4.6.6
  marquee: ^2.2.3
  google_generative_ai: ^0.4.7
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - lib/images/
